[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harborrl-h-cluster"
version = "0.1.0"
description = "Optional H-cluster deployment practice for HarborRL"
requires-python = ">=3.12"
dependencies = ["harborrl>=0.1.0", "harbor==0.23.0", "opensandbox==0.1.9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
