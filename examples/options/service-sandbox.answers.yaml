# Prepare a standard or practice-specific Sandbox config separately.
answers_version: 1
preset: service-sandbox-local-runner
sandbox_config: /srv/shared/site/sandbox.yaml
training:
  tasks:
    catalog: /srv/shared/inputs/tasks.jsonl
  harness:
    profile: /srv/shared/inputs/claude-code.json
  harbor:
    python: /opt/sandbox-runner/bin/python
  model:
    checkpoint: /srv/models/qwen
    reference: /srv/models/qwen-reference
    args_file: qwen3-8B
  gateway:
    tokenizer_digest: REPLACE_WITH_ACTUAL_TOKENIZER_SHA256
    template_digest: REPLACE_WITH_ACTUAL_TEMPLATE_SHA256
  deployment:
    layout: colocate
    num_gpus: 1
deployment:
  manager:
    source_dir: /srv/shared/harborrl
    controller_python: /opt/controller/bin/python
    control_url: http://controller.example:49200
    gateway_url: http://controller.example:49184
  gpu_target:
    ssh:
      host: gpu-training
    source_dir: /srv/shared/harborrl
    train_python: /opt/training/bin/python
  storage:
    run_root: /srv/shared/runs
