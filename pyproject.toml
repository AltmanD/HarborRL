[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harborrl"
version = "0.1.0"
description = "Harbor task integration and agentic RL training framework"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
harborrl = "harborrl.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["harborrl*"]
exclude = ["runs*", ".venv*", "workspace*", "local*", "docs*", "tests*"]

[tool.setuptools.package-data]
"harborrl.platform" = ["*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
